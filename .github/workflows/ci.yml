name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ADMIN_ACCESS_SECRET: ci-admin-access-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations & seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed
        working-directory: apps/api
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -w apps/api
      - name: Build
        run: npm run build
