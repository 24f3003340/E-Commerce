# Render Blueprint — creates the backend API, PostgreSQL and Redis in one click.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: stylekart-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    # Applies migrations and (idempotently) seeds demo data on every start
    startCommand: cd apps/api && npx prisma migrate deploy && npx prisma db seed && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stylekart-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stylekart-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ADMIN_ACCESS_SECRET
        generateValue: true
      - key: JWT_SELLER_ACCESS_SECRET
        generateValue: true
      - key: SHIPPING_WEBHOOK_TOKEN
        generateValue: true
      # Allow the two Vercel apps (and their preview URLs). Replace with exact
      # domains once you have custom domains, e.g. https://www.yourstore.com
      - key: CORS_ORIGINS
        value: https://*.vercel.app
      # Checkout is cash on delivery only until the three RAZORPAY_* keys below are set; online
      # payment (UPI / cards / net banking) then switches on by itself.
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      # Change this in the Render dashboard → Environment, then log in to the admin panel
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Your website URL, e.g. https://www.yourstore.com (used in emails)
      - key: STOREFRONT_URL
        sync: false
      # Admin app URL, e.g. https://admin.yourstore.com — sellers use <ADMIN_URL>/seller
      - key: ADMIN_URL
        sync: false
      # Cloudflare R2 / S3 for product images (uploads on Render's disk are lost on redeploy)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

  - type: keyvalue
    name: stylekart-cache
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: stylekart-db
    plan: free
    region: singapore
    databaseName: ecommerce
    user: ecommerce
